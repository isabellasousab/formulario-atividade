<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Curso de Programação</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Inscrição para Curso de Programação</h1>

    <p class="descricao">
        Preencha o formulário abaixo para realizar sua inscrição.
    </p>

    <form action="#" method="post">

        <fieldset>
            <legend>Dados pessoais</legend>

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
            <br><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Digite seu sobrenome" required>
            <br><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            <br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo de 8 caracteres" minlength="8" required>
            <br><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
            <br><br>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="14" max="100" required>
            <br><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required>

        </fieldset>

        <fieldset>
            <legend>Informações do curso</legend>

            <p>Escolha o curso:</p>

            <input type="radio" id="html" name="curso" value="HTML e CSS" required>
            <label for="html">HTML e CSS</label>
            <br>

            <input type="radio" id="javascript" name="curso" value="JavaScript">
            <label for="javascript">JavaScript</label>
            <br>

            <input type="radio" id="python" name="curso" value="Python">
            <label for="python">Python</label>
            <br>

            <input type="radio" id="java" name="curso" value="Java">
            <label for="java">Java</label>
            <br>

            <input type="radio" id="banco" name="curso" value="Banco de Dados">
            <label for="banco">Banco de Dados</label>

            <p>Modalidade:</p>

            <input type="radio" id="presencial" name="modalidade" value="Presencial" required>
            <label for="presencial">Presencial</label>

            <input type="radio" id="online" name="modalidade" value="Online">
            <label for="online">Online</label>

            <p>Turno:</p>

            <input type="radio" id="manha" name="turno" value="Manhã" required>
            <label for="manha">Manhã</label>

            <input type="radio" id="tarde" name="turno" value="Tarde">
            <label for="tarde">Tarde</label>

            <input type="radio" id="noite" name="turno" value="Noite">
            <label for="noite">Noite</label>

            <p>
                <label for="nivel">Nível de conhecimento:</label>

                <select id="nivel" name="nivel" required>
                    <option value="" disabled selected>Selecione seu nível</option>
                    <option value="iniciante">Iniciante</option>
                    <option value="intermediario">Intermediário</option>
                    <option value="avancado">Avançado</option>
                </select>
            </p>

        </fieldset>

        <fieldset>
            <legend>Conhecimentos</legend>

            <p>Quais tecnologias você já conhece?</p>

            <input type="checkbox" id="html-conhece" name="tecnologias" value="HTML">
            <label for="html-conhece">HTML</label>

            <input type="checkbox" id="css-conhece" name="tecnologias" value="CSS">
            <label for="css-conhece">CSS</label>

            <input type="checkbox" id="js-conhece" name="tecnologias" value="JavaScript">
            <label for="js-conhece">JavaScript</label>

            <br>

            <input type="checkbox" id="python-conhece" name="tecnologias" value="Python">
            <label for="python-conhece">Python</label>

            <input type="checkbox" id="java-conhece" name="tecnologias" value="Java">
            <label for="java-conhece">Java</label>

            <input type="checkbox" id="csharp-conhece" name="tecnologias" value="C#">
            <label for="csharp-conhece">C#</label>

        </fieldset>

        <fieldset>
            <legend>Localização</legend>

            <label for="estado">Estado:</label>

            <select id="estado" name="estado" required>
                <option value="" disabled selected>Selecione seu estado</option>
                <option value="SP">São Paulo</option>
                <option value="RJ">Rio de Janeiro</option>
                <option value="MG">Minas Gerais</option>
                <option value="PR">Paraná</option>
                <option value="SC">Santa Catarina</option>
            </select>

            <br><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite sua cidade" required>

        </fieldset>

        <fieldset>
            <legend>Informações adicionais</legend>

            <label for="motivo">
                Por que você deseja fazer este curso?
            </label>

            <br><br>

            <textarea id="motivo" name="motivo" rows="5" placeholder="Digite sua resposta" minlength="20"
                required></textarea>

            <br><br>

            <input type="checkbox" id="termos" name="termos" value="aceito" required>
            <label for="termos">Aceito os termos de inscrição</label>

        </fieldset>

        <div class="botoes">
            <button type="submit">Cadastrar</button>
            <button type="reset">Limpar</button>
        </div>

    </form>

</body>

</html>
